services:
  # FastAPI Backend
  - type: web
    name: roboalgo-api
    env: python
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: postgres_db
          property: connectionString
      - key: ROBOALGO_REDIS_URL
        fromService:
          name: roboalgo-redis
          type: redis
          property: connectionString
      # Required for the auto-trader control guard. Without it every
      # risk-increasing endpoint (/start, /config, /cycle/run) returns 503.
      # Risk-reducing endpoints (/stop, /kill on=true) stay open regardless,
      # so an operator can always halt the system.
      - key: ROBOALGO_CONTROL_TOKEN
        sync: false
      # Deliberately NOT given ALPACA credentials: this service has no
      # authentication layer and never places orders. Consequence:
      # /status reports is_paper: null. Paper-vs-live is enforced in the
      # worker by config.assert_mode_safe(), not by this display.
    disk:
      name: data
      mountPath: /data
      sizeGB: 10

  # React Frontend
  - type: static_site
    name: roboalgo-web
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - path: /*
        destination: /index.html

  # PostgreSQL Database
  - type: pserv
    name: postgres_db
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all

  # Redis (Celery broker/result backend)
  - type: redis
    name: roboalgo-redis
    ipAllowList: []

  # Celery Worker
  - type: worker
    name: roboalgo-worker
    env: python
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A infrastructure.celery_app worker --loglevel=info --queues=pipeline,symbols,trading --concurrency=2
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: postgres_db
          property: connectionString
      - key: ROBOALGO_REDIS_URL
        fromService:
          name: roboalgo-redis
          type: redis
          property: connectionString
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_PAPER
        sync: false
      - key: ROBOALGO_CONTROL_TOKEN
        sync: false

  # Celery Beat
  - type: worker
    name: roboalgo-beat
    env: python
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A infrastructure.scheduler beat --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: postgres_db
          property: connectionString
      - key: ROBOALGO_REDIS_URL
        fromService:
          name: roboalgo-redis
          type: redis
          property: connectionString
      # Least privilege: beat only enqueues scheduled tasks — it never calls a
      # broker and never serves the control API, so it carries no broker
      # credentials and no control token. Those live on roboalgo-worker only.

envVars:
  - key: VITE_API_BASE_URL
    value: https://roboalgo-api.onrender.com
