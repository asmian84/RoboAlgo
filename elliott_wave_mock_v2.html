// ── Drawing ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');

function mapX(idx, total, pad = 60) { return pad + (idx / (total - 1)) * (canvas.width - pad * 2); }
function mapY(price, lo, hi, padTop = 40, padBot = 40) {
  return padTop + ((hi - price) / (hi - lo)) * (canvas.height - padTop - padBot);
}

function drawChart(sym, view) {
  const data = CHARTS[sym];
  const [pLo, pHi] = data.priceRange;
  const path = data.path;
  const n = path.length;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid
  ctx.strokeStyle = '#21262d';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 8; i++) {
    const y = 40 + i * (canvas.height - 80) / 8;
    ctx.beginPath(); ctx.moveTo(50, y); ctx.lineTo(canvas.width - 20, y); ctx.stroke();
    const price = pHi - (i / 8) * (pHi - pLo);
    ctx.fillStyle = '#484f58';
    ctx.font = '10px monospace';
    ctx.textAlign = 'right';
    ctx.fillText(price >= 1000 ? price.toLocaleString() : price.toFixed(price < 10 ? 2 : 0), 48, y + 3);
  }

  // Price path
  ctx.strokeStyle = '#30363d';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const x = mapX(i, n); const y = mapY(path[i], pLo, pHi);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Candle-like fill
  ctx.strokeStyle = '#21262d';
  ctx.lineWidth = 0.3;
  for (let i = 1; i < n; i++) {
    const x = mapX(i, n); const y = mapY(path[i], pLo, pHi);
    const py = mapY(path[i-1], pLo, pHi);
    ctx.fillStyle = path[i] >= path[i-1] ? 'rgba(35,134,54,0.15)' : 'rgba(218,54,51,0.15)';
    ctx.fillRect(x - 4, Math.min(y, py), 8, Math.abs(y - py) + 1);
  }

  // Title
  ctx.fillStyle = '#e6edf3';
  ctx.font = 'bold 14px -apple-system, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(data.title, 60, 25);

  // Date range
  ctx.fillStyle = '#484f58';
  ctx.font = '10px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(data.dateRange[0], 60, canvas.height - 10);
  ctx.textAlign = 'right';
  ctx.fillText(data.dateRange[1], canvas.width - 20, canvas.height - 10);

  // Draw waves
  if (view === 'Correct') {
    drawWaves(data.correct.waves, n, pLo, pHi, 0);
    drawLabel(data.correct.label, '#fde047', 0);
  } else if (view === 'RoboAlgo') {
    drawWaves(data.roboalgo.waves, n, pLo, pHi, 0);
    drawLabel(data.roboalgo.label + (data.roboalgo.grade ? '' : ''), data.roboalgo.waves[0]?.color || '#ff6b6b', 0);
  } else {
    drawWaves(data.correct.waves, n, pLo, pHi, -12);
    drawWaves(data.roboalgo.waves, n, pLo, pHi, 12);
    drawLabel('Green = Correct    Red = RoboAlgo', '#8b949e', 0);
  }

  // Notes
  const notesEl = document.getElementById('notes');
  if (view === 'Correct') notesEl.innerHTML = data.correct.notes;
  else if (view === 'RoboAlgo') notesEl.innerHTML = data.roboalgo.notes;
  else notesEl.innerHTML = data.correct.notes + '<br><br>' + data.roboalgo.notes;
}

function drawWaves(waves, totalPts, pLo, pHi, yOffset) {
  for (const w of waves) {
    const x1 = mapX(w.from[0], totalPts);
    const y1 = mapY(w.from[1], pLo, pHi) + yOffset;
    const x2 = mapX(w.to[0], totalPts);
    const y2 = mapY(w.to[1], pLo, pHi) + yOffset;

    // Line
    ctx.strokeStyle = w.violation ? '#ff4444' : (w.color || '#fde047');
    ctx.lineWidth = w.ext ? 4 : 3;
    if (w.dashed) ctx.setLineDash([8, 4]);
    else ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.setLineDash([]);

    // Violation X mark
    if (w.violation) {
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      ctx.strokeStyle = '#ff0000';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(mx - 8, my - 8); ctx.lineTo(mx + 8, my + 8); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(mx + 8, my - 8); ctx.lineTo(mx - 8, my + 8); ctx.stroke();
      ctx.fillStyle = '#ff4444';
      ctx.font = 'bold 9px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('RULE 3 VIOLATION', mx, my - 14);
    }

    // Extended wave glow
    if (w.ext) {
      ctx.strokeStyle = w.color ? w.color + '40' : '#fde04740';
      ctx.lineWidth = 10;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }

    // Wave label circle
    ctx.fillStyle = w.violation ? '#ff4444' : (w.color || '#fde047');
    ctx.beginPath(); ctx.arc(x2, y2, 12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0d1117';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(w.n, x2, y2 + 4);

    // Start circle for first wave
    if (w === waves[0]) {
      ctx.fillStyle = w.color || '#fde047';
      ctx.beginPath(); ctx.arc(x1, y1, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#0d1117';
      ctx.font = 'bold 9px sans-serif';
      ctx.fillText('S', x1, y1 + 3);
    }

    // Price annotation
    ctx.fillStyle = '#8b949e';
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    const priceStr = w.to[1] >= 1000 ? '$' + w.to[1].toLocaleString() : '$' + w.to[1].toFixed(w.to[1] < 10 ? 2 : 0);
    ctx.fillText(priceStr, x2, y2 + (y2 < canvas.height / 2 ? -18 : 24));
  }
}

function drawLabel(text, color, yOff) {
  ctx.fillStyle = color;
  ctx.font = '12px -apple-system, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(text, canvas.width - 30, 25 + yOff);
}

  vt.innerHTML = VIEWS.map(v =>
    `<div class="view-tab ${v === activeView ? 'active' : ''}" onclick="selectView('${v}')">${v}</div>`
  ).join('');

  const legendEl = document.getElementById('legend');
  legendEl.innerHTML = `
    <div class="legend-item"><div class="legend-dot" style="background:#fde047"></div> Correct / Impulse wave</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f87171"></div> Bearish impulse wave</div>
    <div class="legend-item"><div class="legend-dot" style="background:#ff4444"></div> Rule violation</div>
    <div class="legend-item"><div class="legend-dot" style="background:#fde04740;border:1px solid #fde047"></div> Extended wave (glow)</div>
    <div class="legend-item" style="border-left:2px dashed #fde047;padding-left:6px"> Projected / in-progress</div>
  `;
}

function selectSymbol(s) { activeSymbol = s; buildTabs(); drawChart(s, activeView); }
function selectView(v) { activeView = v; buildTabs(); drawChart(activeSymbol, v); }

buildTabs();
drawChart(activeSymbol, activeView);
</script>
</body>
