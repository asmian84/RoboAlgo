const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');

// ═══════════════════════════════════════════════════════════════════════
// COORDINATE HELPERS
// ═══════════════════════════════════════════════════════════════════════
let _cl, _ct, _cw, _ch, _minP, _maxP, _minD, _maxD;

function setupCoords(sym) {
  const s = SYMBOLS[sym];
  _minP = s.priceRange[0]; _maxP = s.priceRange[1];
  _minD = new Date(s.dateRange[0]); _maxD = new Date(s.dateRange[1]);
}

function dateToX(dateStr) {
  const d = new Date(dateStr);
  return _cl + ((d - _minD) / (_maxD - _minD)) * _cw;
}

function priceToY(price) {
  return _ct + _ch - ((price - _minP) / (_maxP - _minP)) * _ch;
}

// ═══════════════════════════════════════════════════════════════════════
// DRAWING PRIMITIVES
// ═══════════════════════════════════════════════════════════════════════

function drawGrid(sym) {
  const s = SYMBOLS[sym];
  ctx.strokeStyle = '#1e222d';
  ctx.lineWidth = 0.5;
  ctx.fillStyle = '#787b86';
  ctx.font = '10px -apple-system, sans-serif';

  // Price grid
  const range = _maxP - _minP;
  const step = range > 100 ? (range > 1000 ? 500 : 50) : (range > 10 ? 1 : 0.5);
  for (let p = Math.ceil(_minP / step) * step; p <= _maxP; p += step) {
    const y = priceToY(p);
    ctx.beginPath(); ctx.moveTo(_cl, y); ctx.lineTo(_cl + _cw, y); ctx.stroke();
    ctx.textAlign = 'right';
    const label = p >= 100 ? '$' + p.toLocaleString() : '$' + p.toFixed(2);
    ctx.fillText(label, _cl - 6, y + 3);
  }

  // Date grid
  const months = [];
  const d = new Date(_minD);
  while (d <= _maxD) {
    if (d.getMonth() % 6 === 0) months.push(new Date(d));
    d.setMonth(d.getMonth() + 1);
  }
  ctx.textAlign = 'center';
  for (const m of months) {
    const x = _cl + ((m - _minD) / (_maxD - _minD)) * _cw;
    ctx.beginPath(); ctx.moveTo(x, _ct); ctx.lineTo(x, _ct + _ch); ctx.stroke();
    ctx.fillText(m.toISOString().substring(0, 7), x, _ct + _ch + 18);
  }
}

function drawPriceCurve(sym) {
  const pts = SYMBOLS[sym].pricePivots;
  ctx.beginPath();
  ctx.strokeStyle = '#4a5568';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < pts.length; i++) {
    const x = dateToX(pts[i].date), y = priceToY(pts[i].price);
    if (i === 0) { ctx.moveTo(x, y); continue; }
    const prev = pts[i - 1];
    const px = dateToX(prev.date), py = priceToY(prev.price);
    const mx = (px + x) / 2;
    ctx.bezierCurveTo(mx, py, mx, y, x, y);
  }
  ctx.stroke();

  // Area fill
  const lastPt = pts[pts.length - 1];
  ctx.lineTo(dateToX(lastPt.date), _ct + _ch);
  ctx.lineTo(dateToX(pts[0].date), _ct + _ch);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0, _ct, 0, _ct + _ch);
  grad.addColorStop(0, 'rgba(74,85,104,0.12)');
  grad.addColorStop(1, 'rgba(74,85,104,0.01)');
  ctx.fillStyle = grad;
  ctx.fill();
}

function drawWaveLine(pivots, color, dashed, alpha) {
  if (pivots.length < 2) return;
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.globalAlpha = alpha;
  ctx.setLineDash(dashed ? [8, 5] : []);
  for (let i = 0; i < pivots.length; i++) {
    const x = dateToX(pivots[i].date), y = priceToY(pivots[i].price);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
}

function drawCircleLabel(pt, color, above, alpha) {
  const x = dateToX(pt.date), y = priceToY(pt.price);
  const off = above ? -22 : 22;
  ctx.globalAlpha = alpha;
  // Circle
  ctx.beginPath(); ctx.arc(x, y + off, 13, 0, Math.PI * 2);
  ctx.fillStyle = color; ctx.fill();
  ctx.strokeStyle = '#131722'; ctx.lineWidth = 2; ctx.stroke();
  // Label
  ctx.fillStyle = '#131722'; ctx.font = 'bold 11px -apple-system, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(pt.label, x, y + off);
  // Price
  ctx.fillStyle = '#d1d4dc'; ctx.globalAlpha = alpha * 0.7;
  ctx.font = '9px -apple-system, sans-serif';
  const priceStr = pt.price >= 100 ? '$' + pt.price.toLocaleString() : '$' + pt.price.toFixed(2);
  ctx.fillText(priceStr, x, y + off + (above ? -17 : 17));
  ctx.globalAlpha = 1;
}

function drawAnnotation(text, dateStr, price, color, alpha) {
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.font = '11px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(text, dateToX(dateStr), priceToY(price));
  ctx.globalAlpha = 1;
}

function drawFibZone(zone, alpha) {
  if (!zone) return;
  const x1 = dateToX(zone.from), x2 = dateToX(zone.to);
  const y382 = priceToY(zone.fib382), y500 = priceToY(zone.fib500);
  ctx.globalAlpha = alpha * 0.08;
  ctx.fillStyle = '#26a69a';
  ctx.fillRect(x1, Math.min(y382, y500), x2 - x1, Math.abs(y500 - y382));
  ctx.globalAlpha = alpha * 0.4;
  ctx.strokeStyle = '#26a69a'; ctx.lineWidth = 0.5; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(x1, y382); ctx.lineTo(x2, y382); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x1, y500); ctx.lineTo(x2, y500); ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = '9px -apple-system, sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('38.2%', x2 + 4, y382 + 3);
  ctx.fillText('50.0%', x2 + 4, y500 + 3);
  ctx.globalAlpha = 1;
}

function drawErrorX(pt, alpha) {
  const x = dateToX(pt.date), y = priceToY(pt.price) - 42;
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = '#ef5350'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x-6,y-6); ctx.lineTo(x+6,y+6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+6,y-6); ctx.lineTo(x-6,y+6); ctx.stroke();
  ctx.globalAlpha = 1;
}

// ═══════════════════════════════════════════════════════════════════════
// WAVE DRAWING — Correct
// ═══════════════════════════════════════════════════════════════════════

function drawCorrect(sym, alpha) {
  const c = SYMBOLS[sym].correct;
  const gold = '#f0b90b';
  const isDown = c.type.includes('down');
  const mainColor = isDown ? '#ef5350' : gold;

  // Solid wave lines
  drawWaveLine(c.pivots, mainColor, false, alpha);
  // Projected
  if (c.projected && c.projected.length) {
    const projColor = isDown ? '#26a69a' : gold;
    drawWaveLine([c.pivots[c.pivots.length - 1], ...c.projected], projColor, true, alpha * 0.5);
    for (const p of c.projected) {
      drawCircleLabel(p, projColor, !isDown, alpha * 0.5);
    }
  }
  // Labels
  for (let i = 0; i < c.pivots.length; i++) {
    const p = c.pivots[i];
    const isOdd = i % 2 === 1;
    const above = isDown ? !isOdd : isOdd;
    const color = (p.label === '3') ? '#26a69a' : (p.label === '0' ? '#787b86' : mainColor);
    drawCircleLabel(p, color, above, alpha);
  }
  // Fib zone
  drawFibZone(c.fibZone, alpha);
  // Annotations
  if (c.annotations) {
    for (const a of c.annotations) {
      drawAnnotation(a.text, a.x, a.y, a.color, alpha * 0.8);
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════
// WAVE DRAWING — RoboAlgo (broken)
// ═══════════════════════════════════════════════════════════════════════

function drawRoboAlgo(sym, alpha) {
  const r = SYMBOLS[sym].roboalgo;
  const orange = '#ff9800';
  const red = '#ef5350';

  // Main wave
  drawWaveLine(r.pivots, orange, false, alpha);
  // Projected
  if (r.projected && r.projected.length) {
    drawWaveLine([r.pivots[r.pivots.length - 1], ...r.projected], red, true, alpha * 0.5);
    for (const p of r.projected) {
      drawCircleLabel(p, red, true, alpha * 0.5);
    }
  }
  // Labels
  for (let i = 0; i < r.pivots.length; i++) {
    const p = r.pivots[i];
    const above = i % 2 === 1;
    drawCircleLabel(p, i === 0 ? '#787b86' : orange, above, alpha);
  }
  // Error annotations
  if (currentView !== 'compare' && r.errors) {
    const startY = priceToY((_maxP + _minP) * 0.38);
    const midX = (_cl + _cl + _cw) / 2;
    ctx.globalAlpha = alpha * 0.8;
    for (let i = 0; i < r.errors.length; i++) {
      ctx.fillStyle = i === 0 ? '#ef5350' : '#787b86';
      ctx.font = (i === 0 ? 'bold ' : '') + '11px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText((i === 0 ? '⚠ ' : '  ') + r.errors[i], midX, startY + i * 18);
    }
    ctx.globalAlpha = 1;
  }
  // X marks in compare mode
  if (currentView === 'compare') {
    for (let i = 1; i < r.pivots.length; i++) {
      drawErrorX(r.pivots[i], 0.5);
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════
// MAIN DRAW
// ═══════════════════════════════════════════════════════════════════════

function resize() {
  const c = canvas.parentElement;
  canvas.width = c.clientWidth * 2;
  canvas.height = c.clientHeight * 2;
  canvas.style.width = c.clientWidth + 'px';
  canvas.style.height = c.clientHeight + 'px';
  ctx.setTransform(2, 0, 0, 2, 0, 0);
  draw();
}

function draw() {
  const w = canvas.width / 2, h = canvas.height / 2;
  ctx.clearRect(0, 0, w, h);
  const m = { top: 30, right: 160, bottom: 80, left: 65 };
  _cl = m.left; _ct = m.top; _cw = w - m.left - m.right; _ch = h - m.top - m.bottom;
  setupCoords(currentSymbol);

  drawGrid(currentSymbol);
  drawPriceCurve(currentSymbol);

  if (currentView === 'correct' || currentView === 'compare') {
    drawCorrect(currentSymbol, currentView === 'compare' ? 0.9 : 1.0);
  }
  if (currentView === 'roboalgo' || currentView === 'compare') {
    drawRoboAlgo(currentSymbol, currentView === 'compare' ? 0.6 : 1.0);
  }

  updateLegend();
  updateInfoPanel();
}

// ═══════════════════════════════════════════════════════════════════════
// LEGEND & INFO
// ═══════════════════════════════════════════════════════════════════════

function updateLegend() {
  const s = SYMBOLS[currentSymbol];
  const leg = document.getElementById('legend');
  if (currentView === 'correct') {
    const c = s.correct;
    leg.innerHTML = `
      <div class="legend-title" style="color:#26a69a">✓ Correct Count — ${s.name}</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#f0b90b"></div> Impulse waves</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#f0b90b;opacity:0.5"></div> Projected</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#26a69a"></div> Fib zone</div>
      <br>
      <div style="color:#787b86;line-height:1.6">
        ${c.pivots.filter(p=>p.desc).map(p=>`<div><span style="color:#e0e3eb">${p.label}:</span> ${p.desc}</div>`).join('')}
      </div>`;
  } else if (currentView === 'roboalgo') {
    leg.innerHTML = `
      <div class="legend-title" style="color:#ef5350">✗ RoboAlgo — ${s.name}</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#ff9800"></div> Broken impulse</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#ef5350;opacity:0.5"></div> Wrong projection</div>
      <br>
      <div style="color:#787b86;line-height:1.6">
        ${s.roboalgo.errors.map((e,i) => `<div>${i===0?'<span class="bug-tag">BUG</span> ':''}<span style="color:${i===0?'#ef5350':'#787b86'}">${e}</span></div>`).join('')}
      </div>`;
  } else {
    leg.innerHTML = `
      <div class="legend-title">Comparison — ${s.name}</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#f0b90b"></div> Correct (gold)</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#ff9800"></div> RoboAlgo (orange)</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#ef5350"></div> ✗ Wrong labels</div>`;
  }
}

function updateInfoPanel() {
  const s = SYMBOLS[currentSymbol];
  const cards = currentView === 'roboalgo' ? s.infoBroken : s.infoCorrect;
  const panel = document.getElementById('infoPanel');
  panel.innerHTML = cards.map(c => `
    <div class="info-card${c.hl?' highlight':''}${c.err?' style="border-color:#ef5350"':''}">
      <div class="label">${c.label}</div>
      <div class="value"${c.err?' style="color:#ef5350"':''}>${c.value}</div>
      <div class="sub">${c.sub}</div>
    </div>`).join('');
}

// ═══════════════════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════════════════

function setSymbol(sym) {
  currentSymbol = sym;
  document.querySelectorAll('.sym-tab').forEach(t => t.classList.remove('active'));
  const tabs = document.querySelectorAll('.sym-tab');
  const idx = sym === 'gcf' ? 0 : sym === 'aapl' ? 1 : 2;
  tabs[idx].classList.add('active');
  draw();
}

function setView(view) {
  currentView = view;
  document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
  const tabs = document.querySelectorAll('.view-tab');
  tabs[view === 'correct' ? 0 : view === 'roboalgo' ? 1 : 2].classList.add('active');
  draw();
}

// Tooltip
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const s = SYMBOLS[currentSymbol];
  const pivots = currentView === 'roboalgo' ? s.roboalgo.pivots : s.correct.pivots;
  let closest = null, closestDist = 30;
  for (const pt of pivots) {
    const px = dateToX(pt.date), py = priceToY(pt.price);
    const d = Math.sqrt((mx-px)**2 + (my-py)**2);
    if (d < closestDist) { closestDist = d; closest = pt; }
  }
  const tt = document.getElementById('tooltip');
  if (closest) {
    tt.style.display = 'block';
    tt.style.left = (mx+14)+'px'; tt.style.top = (my-8)+'px';
    const p = closest.price >= 100 ? '$'+closest.price.toLocaleString() : '$'+closest.price.toFixed(2);
    tt.innerHTML = `<strong>${closest.label}</strong> — ${p}<br><span style="color:#787b86">${closest.date}</span>${closest.desc?'<br>'+closest.desc:''}`;
  } else { tt.style.display = 'none'; }
});
canvas.addEventListener('mouseleave', () => { document.getElementById('tooltip').style.display = 'none'; });

window.addEventListener('resize', resize);
resize();
</script>
</body>
